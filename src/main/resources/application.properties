spring.application.name=jobtrackr

# In-memory H2 database: data resets on restart. Swap for MySQL later (see README).
spring.datasource.url=jdbc:h2:mem:jobtrackr
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# AI settings. Set the key as an environment variable. Never commit it.
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=claude-sonnet-5-5
app.ai.base-url=https://api.anthropic.com
